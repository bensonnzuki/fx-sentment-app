name: Update Forex Data
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi yfinance pandas openpyxl
      - run: python scraper.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add docs/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Manual data refresh" && git push)
