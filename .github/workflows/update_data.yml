name: Update Forex Data
on:
  schedule:
    - cron: '*/5 3-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi yfinance pandas
      - run: python scraper.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sentiment data" && git push)
