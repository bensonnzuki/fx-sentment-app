<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SessionEdge</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0f172a; color:#f8fafc; }
  header { position:sticky; top:0; background:#1e293b; padding:12px 14px; border-bottom:1px solid #334155; z-index:10; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:17px; margin:0; }
  .ts { font-size:11px; color:#94a3b8; margin-top:2px; }
  button { background:#3b82f6; color:#fff; border:none; border-radius:6px; padding:7px 12px; font-weight:600; font-size:12px; min-width:82px; }
  .stale { display:none; background:#7f1d1d; color:#fecaca; border:1px solid #ef4444; border-radius:8px; padding:8px 10px; font-size:12px; font-weight:600; margin-top:8px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-top:9px; align-items:center; }
  .lbl { font-size:11px; color:#64748b; font-weight:700; }
  .tab { background:#334155; color:#cbd5e1; padding:5px 10px; border-radius:14px; font-size:12px; white-space:nowrap; }
  .tab.active { background:#3b82f6; color:#fff; }
  .stab { background:#0f172a; color:#94a3b8; padding:4px 9px; border-radius:10px; font-size:11px; border:1px solid #334155; white-space:nowrap; }
  .stab.active { background:#1d4ed8; color:#fff; border-color:#3b82f6; }
  .list { padding:10px; display:flex; flex-direction:column; gap:8px; }
  .card { background:#1e293b; border-radius:10px; padding:12px; border:1px solid #334155; }
  .card.sig { border-color:#3b82f6; }
  .row1 { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .pair { font-weight:700; font-size:16px; }
  .sess { font-size:10px; color:#94a3b8; margin-left:6px; }
  .badge { padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700; white-space:nowrap; }
  .BUY { background:#14532d; color:#4ade80; }
  .SELL { background:#7f1d1d; color:#f87171; }
  .NONE, .LOW, .NO { background:#334155; color:#94a3b8; }
  .bar { display:flex; height:8px; border-radius:4px; overflow:hidden; margin:8px 0; background:#334155; }
  .b-short { background:#ef4444; }
  .b-long { background:#22c55e; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; font-size:11px; color:#cbd5e1; text-align:center; }
  .val { font-weight:700; font-size:13px; color:#f8fafc; }
  .hot { color:#f87171; } .cold { color:#4ade80; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>SessionEdge</h1><div class="ts" id="ts">Loading...</div></div>
    <button id="btn" onclick="load(true)">Refresh</button>
  </div>
  <div class="stale" id="stale"></div>
  <div class="tabs" id="ftabs">
    <div class="tab active" data-f="ALL" onclick="setFilter('ALL',this)">ALL (0)</div>
    <div class="tab" data-f="SIGNALS" onclick="setFilter('SIGNALS',this)">SIGNALS (0)</div>
    <div class="tab" data-f="TIGER" onclick="setFilter('TIGER',this)">TIGER (0)</div>
    <div class="tab" data-f="LONDON" onclick="setFilter('LONDON',this)">LONDON (0)</div>
    <div class="tab" data-f="LONDON-NY" onclick="setFilter('LONDON-NY',this)">LONDON-NY (0)</div>
    <div class="tab" data-f="NEW YORK" onclick="setFilter('NEW YORK',this)">NEW YORK (0)</div>
  </div>
  <div class="tabs">
    <span class="lbl">SORT:</span>
    <div class="stab active" onclick="setSort('SETUP',this)">Best Setups</div>
    <div class="stab" onclick="setSort('LOTS',this)">Total Lots</div>
    <div class="stab" onclick="setSort('RSI',this)">Extreme RSI</div>
    <div class="stab" onclick="setSort('NET',this)">Net Lots</div>
    <div class="stab" onclick="setSort('AZ',this)">A–Z</div>
  </div>
</header>
<div class="list" id="list"></div>
<script>
const DATA_URL = "https://bensonnzuki." + "github" + ".io/fx-sentment-app/latest.json";
let allPairs = [], filter = "ALL", sortBy = "SETUP";
function setFilter(f, el) { filter = f; document.querySelectorAll(".tab").forEach(t => t.classList.remove("active")); el.classList.add("active"); render(); }
function setSort(s, el) { sortBy = s; document.querySelectorAll(".stab").forEach(t => t.classList.remove("active")); el.classList.add("active"); render(); }
function rsiCls(v) { return v >= 70 ? "hot" : (v <= 30 ? "cold" : ""); }
function setupScore(p) {
  let sc = (p.bias === "BUY" || p.bias === "SELL") ? 1000 : (p.bias === "LOW VOL" || p.bias === "NO DATA" ? -500 : 0);
  sc += Math.abs(p.net_sale - p.net_buy);
  if (p.bias === "BUY" && p.rsi_15m && p.rsi_15m <= 35) sc += 40;
  if (p.bias === "SELL" && p.rsi_15m && p.rsi_15m >= 65) sc += 40;
  return sc;
}
function updateCounts() {
  const counts = {
    "ALL": allPairs.length,
    "SIGNALS": allPairs.filter(p => p.bias === "BUY" || p.bias === "SELL").length,
    "TIGER": allPairs.filter(p => (p.sessions || [p.session]).includes("TIGER")).length,
    "LONDON": allPairs.filter(p => (p.sessions || [p.session]).includes("LONDON")).length,
    "LONDON-NY": allPairs.filter(p => (p.sessions || [p.session]).includes("LONDON-NY")).length,
    "NEW YORK": allPairs.filter(p => (p.sessions || [p.session]).includes("NEW YORK")).length
  };
  document.querySelectorAll("#ftabs .tab").forEach(t => {
    const k = t.getAttribute("data-f");
    t.textContent = k + " (" + (counts[k] ?? 0) + ")";
  });
}
function checkStale(updatedStr) {
  const box = document.getElementById("stale");
  const m = /^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})\s+EAT$/.exec(updatedStr || "");
  if (!m) { box.style.display = "none"; return; }
  const ageMin = Math.floor((Date.now() - Date.parse(m[1] + "T" + m[2] + ":00+03:00")) / 60000);
  if (ageMin > 30) {
    box.textContent = "⚠ Data is stale (" + ageMin + " mins old). Check scraper/scheduler.";
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
}
function render() {
  updateCounts();
  const list = document.getElementById("list");
  let rows = allPairs.filter(p => filter === "SIGNALS" ? (p.bias === "BUY" || p.bias === "SELL") : (filter === "ALL" ? true : (p.sessions || [p.session]).includes(filter)));
  rows.sort((a, b) => sortBy === "SETUP" ? setupScore(b) - setupScore(a) : (sortBy === "LOTS" ? b.total_lots - a.total_lots : (sortBy === "RSI" ? Math.abs((b.rsi_15m ?? 50) - 50) - Math.abs((a.rsi_15m ?? 50) - 50) : (sortBy === "NET" ? Math.abs(b.net_lots) - Math.abs(a.net_lots) : a.pair.localeCompare(b.pair)))));
  list.innerHTML = rows.map(p => `<div class="card ${p.bias==='BUY'||p.bias==='SELL'?'sig':''}"><div class="row1"><div><span class="pair">${p.pair}</span><span class="sess">${(p.sessions||[p.session]).join(' • ')}</span></div><span class="badge ${(p.bias||'NONE').split(' ')[0]}">${p.bias}</span></div><div class="bar"><div class="b-short" style="width:${p.net_sale}%"></div><div class="b-long" style="width:${p.net_buy}%"></div></div><div class="grid"><div>Short<div class="val">${p.net_sale}%</div></div><div>Long<div class="val">${p.net_buy}%</div></div><div>Total Lots<div class="val">${Number(p.total_lots).toLocaleString()}</div></div><div>1H RSI<div class="val ${rsiCls(p.rsi_1h)}">${p.rsi_1h??'-'}</div></div><div>15M RSI<div class="val ${rsiCls(p.rsi_15m)}">${p.rsi_15m??'-'}</div></div><div>Net Lots<div class="val ${p.net_lots>0?'cold':(p.net_lots<0?'hot':'')}">${p.net_lots>0?'+':''}${Number(p.net_lots).toLocaleString()}</div></div></div></div>`).join("");
}
async function load(manual) {
  const btn = document.getElementById("btn");
  if (manual) { btn.textContent = "Syncing..."; btn.disabled = true; }
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const sc = d.fingerprint?.sentiment_since ? " • Sent since " + d.fingerprint.sentiment_since : ""; document.getElementById("ts").textContent = "Data: " + d.updated + sc + " (Checked " + now + ")";
    checkStale(d.updated);
    allPairs = d.pairs || [];
    render();
    if (manual) { btn.textContent = "Updated ✓"; setTimeout(() => { btn.textContent = "Refresh"; btn.disabled = false; }, 1200); }
  } catch (e) {
    document.getElementById("ts").textContent = "Connection error";
    if (manual) { btn.textContent = "Refresh"; btn.disabled = false; }
  }
}
load(false);
setInterval(() => load(false), 60000);
</script>
</body>
</html>
